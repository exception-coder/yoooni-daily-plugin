name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  powershell:
    name: PowerShell parse and security self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Error "$($_.FullName): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }
      - name: Run production-log security self-test
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File
          plugins/yoooni-daily-plugin/skills/yoooni-prod-log-query/query-prod-log.ps1
          -SelfTest
      - name: Run update mutex tests
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File
          plugins/yoooni-daily-plugin/scripts/tests/update-lock.tests.ps1

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every shell script
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run update lock tests
        run: bash plugins/yoooni-daily-plugin/scripts/tests/update-lock.test.sh

  hooks:
    name: hook tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run hook tests
        working-directory: plugins/yoooni-daily-plugin/hooks
        run: npm test

  version-sync:
    name: plugin manifest versions in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare Claude, Codex, and marketplace versions
        shell: pwsh
        run: |
          $versions = @(
            (Get-Content plugins/yoooni-daily-plugin/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version,
            (Get-Content plugins/yoooni-daily-plugin/.codex-plugin/plugin.json -Raw | ConvertFrom-Json).version,
            (Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json).plugins[0].version
          )
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "version mismatch: $($versions -join ', ')"
          }
      - name: Require a version bump for runtime payload changes
        run: node scripts/check-runtime-version-bump.js --base "${{ github.event.pull_request.base.sha || 'HEAD^' }}" --target HEAD
